<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .particle {
            position: absolute;
            pointer-events: none;
            animation: particle-float 1s ease-out forwards;
        }
        @keyframes particle-float {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .pulse-glow {
            animation: pulse-glow 0.6s ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.8); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-blue-900 to-indigo-900 text-white font-sans min-h-screen">
    <!-- Header -->
    <div class="text-center py-8">
        <h1 class="text-5xl font-bold bg-gradient-to-r from-yellow-400 to-pink-400 bg-clip-text text-transparent mb-2">
            🧠 Memory Master
        </h1>
        <p class="text-gray-300 text-lg">Challenge your memory and find all matching pairs!</p>
    </div>

    <!-- Sound Toggle -->
    <div class="text-center mb-4">
        <button onclick="toggleSound()" id="soundBtn" class="bg-white/10 backdrop-blur-sm px-4 py-2 rounded-lg border border-white/20 hover:bg-white/20 transition-all">
            🔊 Sound ON
        </button>
    </div>

    <!-- Game Stats -->
    <div class="max-w-md mx-auto mb-8">
        <div class="bg-white/10 backdrop-blur-sm rounded-xl p-6 border border-white/20">
            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="bg-blue-500/20 rounded-lg p-3">
                    <div class="text-2xl font-bold" id="score">0</div>
                    <div class="text-sm text-gray-300">Score</div>
                </div>
                <div class="bg-green-500/20 rounded-lg p-3">
                    <div class="text-2xl font-bold" id="moves">0</div>
                    <div class="text-sm text-gray-300">Moves</div>
                </div>
                <div class="bg-purple-500/20 rounded-lg p-3">
                    <div class="text-2xl font-bold" id="timer">00:00</div>
                    <div class="text-sm text-gray-300">Time</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Board -->
    <div class="flex justify-center mb-8">
        <div id="gameBoard" class="grid grid-cols-4 gap-4 p-6 bg-white/5 backdrop-blur-sm rounded-2xl border border-white/20 relative"></div>
    </div>

    <!-- Controls -->
    <div class="text-center mb-8">
        <button onclick="startGame()" class="bg-gradient-to-r from-green-500 to-blue-500 hover:from-green-600 hover:to-blue-600 px-8 py-4 rounded-xl font-bold text-lg shadow-lg transform hover:scale-105 transition-all duration-200 mr-4">
            🎮 New Game
        </button>
        <button onclick="pauseGame()" id="pauseBtn" class="bg-gradient-to-r from-yellow-500 to-orange-500 hover:from-yellow-600 hover:to-orange-600 px-8 py-4 rounded-xl font-bold text-lg shadow-lg transform hover:scale-105 transition-all duration-200">
            ⏸️ Pause
        </button>
    </div>

    <!-- Win Modal -->
    <div id="winModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-8 border border-white/20 text-center max-w-md mx-4">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-3xl font-bold mb-4 bg-gradient-to-r from-yellow-400 to-pink-400 bg-clip-text text-transparent">
                Congratulations!
            </h2>
            <div id="winStats" class="text-lg mb-6 space-y-2"></div>
            <button onclick="closeModal()" class="bg-gradient-to-r from-green-500 to-blue-500 hover:from-green-600 hover:to-blue-600 px-6 py-3 rounded-lg font-bold">
                Play Again
            </button>
        </div>
    </div>

    <!-- Difficulty Selector -->
    <div class="text-center mb-8">
        <div class="inline-flex bg-white/10 backdrop-blur-sm rounded-xl p-2 border border-white/20">
            <button onclick="setDifficulty('easy')" class="difficulty-btn px-4 py-2 rounded-lg font-semibold transition-all" data-difficulty="easy">
                Easy (3x2)
            </button>
            <button onclick="setDifficulty('normal')" class="difficulty-btn px-4 py-2 rounded-lg font-semibold transition-all bg-blue-500 text-white" data-difficulty="normal">
                Normal (4x4)
            </button>
            <button onclick="setDifficulty('hard')" class="difficulty-btn px-4 py-2 rounded-lg font-semibold transition-all" data-difficulty="hard">
                Hard (6x4)
            </button>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
