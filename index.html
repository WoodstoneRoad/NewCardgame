<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-800 text-white font-sans text-center">
    <h1 class="text-4xl font-bold mt-8 mb-4">Memory Card Game</h1>
    <div class="text-lg mb-6">
        Score: <span id="score" class="font-semibold">0</span> | 
        Moves: <span id="moves" class="font-semibold">0</span>
    </div>
    <div id="gameBoard" class="grid grid-cols-4 gap-3 max-w-sm mx-auto mb-6"></div>
    <button onclick="startGame()" class="bg-blue-500 hover:bg-blue-600 px-6 py-3 rounded-lg font-semibold transition-colors">
        New Game
    </button>
    
    <script src="main.js"></script>
</body>
</html>
